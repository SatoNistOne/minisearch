<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minisearch</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1b1c20;
  --muted: #696c77;
  --border: #dfe1e6;
  --hover: rgba(20, 30, 60, 0.05);
  --accent: #2f6fde;
  --accent-text: #ffffff;
  --mark: #ffe27a;
  --warn-bg: #fff4d6;
  --warn-text: #7a5a00;
  --ok: #1f8a4c;
  --err: #c93c3c;
  --drop: #eef3ff;
  --shadow: 0 6px 24px rgba(15, 20, 40, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15161a;
    --panel: #1e1f25;
    --text: #e7e8ec;
    --muted: #9a9ca8;
    --border: #33353d;
    --hover: rgba(255, 255, 255, 0.05);
    --accent: #6c9cff;
    --accent-text: #0d1220;
    --mark: #6b5a12;
    --warn-bg: #3d3313;
    --warn-text: #f2d36b;
    --ok: #4cc38a;
    --err: #ff7a7a;
    --drop: #1f2a44;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15161a;
  --panel: #1e1f25;
  --text: #e7e8ec;
  --muted: #9a9ca8;
  --border: #33353d;
  --hover: rgba(255, 255, 255, 0.05);
  --accent: #6c9cff;
  --accent-text: #0d1220;
  --mark: #6b5a12;
  --warn-bg: #3d3313;
  --warn-text: #f2d36b;
  --ok: #4cc38a;
  --err: #ff7a7a;
  --drop: #1f2a44;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
}
button, input, select {
  font: inherit;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
}
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.ghost { background: transparent; }
button.ghost:hover { background: var(--hover); }
button:disabled { opacity: 0.5; cursor: default; }
button.link {
  border: none;
  background: none;
  padding: 0;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
button.link:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font-size: 19px; }
.muted { color: var(--muted); font-size: 13px; }
main { max-width: 1240px; margin: 0 auto; padding: 20px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
form.search { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest-wrap { position: relative; flex: 1 1 260px; min-width: 0; display: flex; }
input[type=search] { flex: 1; min-width: 0; padding: 9px 12px; }
.suggest {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 10;
  list-style: none;
  margin: 0;
  padding: 4px 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.suggest li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 12px; cursor: pointer; }
.suggest li.active, .suggest li:hover { background: var(--hover); }
.suggest .count { color: var(--muted); font-size: 12px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
.check input { margin: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 20px;
  margin-top: 20px;
  align-items: start;
}
aside { display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  main { padding: 16px; }
  .top { padding: 12px 16px; }
}
h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
.warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.empty-state { color: var(--muted); text-align: center; padding: 36px 12px; }
ol.hits { list-style: none; padding: 0; margin: 0; }
ol.hits li { padding: 14px 0; border-top: 1px solid var(--border); }
ol.hits li:first-child { border-top: none; padding-top: 4px; }
.hit-title { font-weight: 600; font-size: 16px; }
.hit-info { color: var(--muted); font-size: 12px; margin: 2px 0 6px; display: flex; flex-wrap: wrap; gap: 12px; }
.snippet { margin: 0; overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.pager { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 22px 12px;
  border: 2px dashed var(--border);
  border-radius: 10px;
  text-align: center;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.dropzone:hover, .dropzone.over { background: var(--drop); border-color: var(--accent); }
.dropzone strong { color: var(--text); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
ul.plain { list-style: none; margin: 0; padding: 0; }
.upload-results { margin-top: 10px; font-size: 13px; }
.upload-results li { padding: 3px 0; overflow-wrap: anywhere; }
.upload-results .ok { color: var(--ok); }
.upload-results .exists { color: var(--muted); }
.upload-results .error { color: var(--err); }
.doc-list { max-height: 520px; overflow-y: auto; margin: 0 -6px; }
.doc-list li { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; }
.doc-list li:hover { background: var(--hover); }
.doc-list .doc-main { flex: 1; min-width: 0; }
.doc-list .doc-title { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-list .doc-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.icon { border: none; background: none; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
button.icon:hover { color: var(--err); background: var(--hover); }
.more { width: 100%; margin-top: 8px; }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; margin: 8px 0 0; }
dialog.viewer {
  margin: 0 0 0 auto;
  width: min(680px, 100vw);
  max-width: 100vw;
  height: 100dvh;
  max-height: 100dvh;
  border: none;
  border-left: 1px solid var(--border);
  padding: 0;
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--shadow);
}
dialog.viewer::backdrop { background: rgba(0, 0, 0, 0.4); }
.viewer-inner { display: flex; flex-direction: column; height: 100%; }
.viewer-head { display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.viewer-head h2 { flex: 1; margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.viewer-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); }
.viewer-meta .spacer { flex: 1; }
button.danger { color: var(--err); border-color: var(--err); background: transparent; }
.viewer-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>minisearch</h1>
    <span class="muted" id="doc-count"></span>
  </div>
  <button type="button" class="ghost" id="theme" aria-label="Переключить тему"></button>
</header>
<main>
  <section class="card">
    <form class="search" id="search-form" role="search">
      <div class="suggest-wrap">
        <input type="search" id="q" name="q" placeholder="Поиск по документам…" autocomplete="off" autofocus
          role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" aria-label="Запрос">
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </div>
      <select id="operator" name="operator" aria-label="Оператор">
        <option value="or">любое слово</option>
        <option value="and">все слова</option>
      </select>
      <label class="check"><input type="checkbox" id="fuzzy"> с опечатками</label>
      <button type="submit" class="primary">Найти</button>
    </form>
    <p class="hint">Фразы берите в кавычки: <code>"хлеб на закваске"</code>. «С опечатками» находит слова, написанные с ошибкой.</p>
  </section>
  <div class="layout">
    <section class="card" aria-live="polite">
      <div id="warning" class="warn" hidden></div>
      <div id="meta" class="meta"></div>
      <ol class="hits" id="hits"></ol>
      <div id="empty" class="empty-state">Введите запрос или откройте документ из списка.</div>
      <div class="pager" id="pager" hidden>
        <button type="button" class="ghost" id="prev">← Назад</button>
        <span id="page" class="muted"></span>
        <button type="button" class="ghost" id="next">Вперёд →</button>
      </div>
    </section>
    <aside>
      <section class="card">
        <h2>Загрузить файлы</h2>
        <label class="dropzone" id="dropzone" for="files">
          <strong>Перетащите файлы сюда</strong>
          <span>или нажмите, чтобы выбрать</span>
          <span class="muted">.txt (UTF-8) и .docx, до 10 МБ</span>
        </label>
        <input type="file" id="files" class="visually-hidden" multiple accept=".txt,.docx">
        <ul class="plain upload-results" id="upload-results"></ul>
      </section>
      <section class="card">
        <h2>Документы <span class="muted" id="docs-total"></span></h2>
        <ul class="plain doc-list" id="doc-list"></ul>
        <button type="button" class="ghost more" id="more" hidden>Показать ещё</button>
        <p class="status" id="docs-status"></p>
      </section>
    </aside>
  </div>
</main>
<dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-inner">
    <div class="viewer-head">
      <h2 id="viewer-title"></h2>
      <button type="button" class="ghost" id="viewer-close" aria-label="Закрыть">✕</button>
    </div>
    <div class="viewer-meta">
      <span class="muted" id="viewer-id"></span>
      <span class="muted" id="viewer-words"></span>
      <span class="spacer"></span>
      <button type="button" class="danger" id="viewer-delete">Удалить</button>
    </div>
    <div class="viewer-body" id="viewer-body"></div>
  </div>
</dialog>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { q: "", operator: "or", fuzzy: false, from: 0, size: 10, doc: "" };
const MAX_FILE = 10 * 1024 * 1024;
const MAX_BATCH = 20;
const EXTENSIONS = ["txt", "docx"];

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function plural(n, one, few, many) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function storeGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function storeSet(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

const THEMES = [["auto", "◐ Авто"], ["light", "☀ Светлая"], ["dark", "☾ Тёмная"]];

function applyTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  const label = THEMES.find(([m]) => m === mode)[1];
  $("theme").textContent = label;
  $("theme").title = "Тема: " + label.slice(2).toLowerCase();
}

let theme = THEMES.some(([m]) => m === storeGet("theme")) ? storeGet("theme") : "auto";
applyTheme(theme);
$("theme").addEventListener("click", () => {
  const i = THEMES.findIndex(([m]) => m === theme);
  theme = THEMES[(i + 1) % THEMES.length][0];
  storeSet("theme", theme);
  applyTheme(theme);
});

function readUrl() {
  const p = new URLSearchParams(location.search);
  state.q = p.get("q") || "";
  state.operator = p.get("operator") === "and" ? "and" : "or";
  state.fuzzy = p.get("fuzzy") === "true";
  state.from = Math.max(0, parseInt(p.get("from"), 10) || 0);
  const size = parseInt(p.get("size"), 10);
  state.size = size > 0 && size <= 100 ? size : 10;
  state.doc = p.get("doc") || "";
  $("q").value = state.q;
  $("operator").value = state.operator;
  $("fuzzy").checked = state.fuzzy;
}

function writeUrl(push) {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.operator !== "or") p.set("operator", state.operator);
  if (state.fuzzy) p.set("fuzzy", "true");
  if (state.from) p.set("from", String(state.from));
  if (state.size !== 10) p.set("size", String(state.size));
  if (state.doc) p.set("doc", state.doc);
  const qs = p.toString();
  const url = location.pathname + (qs ? "?" + qs : "");
  if (push) history.pushState(null, "", url); else history.replaceState(null, "", url);
}

async function errorText(resp) {
  const text = await resp.text();
  try {
    const body = JSON.parse(text);
    if (body.failed_shards) return "хранилище временно недоступно";
    return body.result || text;
  } catch {
    return text || "ошибка " + resp.status;
  }
}

function renderSnippet(segments) {
  const p = el("p", undefined, "snippet");
  for (const seg of segments || []) {
    p.appendChild(seg.hl ? el("mark", seg.text) : document.createTextNode(seg.text));
  }
  return p;
}

function showWarning(text) {
  $("warning").hidden = !text;
  $("warning").textContent = text || "";
}

function clearResults() {
  $("hits").replaceChildren();
  $("meta").textContent = "";
  $("pager").hidden = true;
  showWarning("");
  $("empty").hidden = false;
}

function renderResults(data) {
  const hits = $("hits");
  hits.replaceChildren();
  $("empty").hidden = true;
  showWarning((data.failed_shards || []).length ? "Часть данных временно недоступна, результаты могут быть неполными." : "");
  const shown = data.hits.length;
  $("meta").textContent = data.total === 0
    ? "Ничего не найдено · " + data.took_ms + " мс"
    : "Найдено " + data.total + " " + plural(data.total, "документ", "документа", "документов")
      + " · показаны " + (data.from + 1) + "–" + (data.from + shown) + " · " + data.took_ms + " мс";
  for (const hit of data.hits) {
    const li = el("li");
    const title = el("button", hit.title || hit.id, "link hit-title");
    title.type = "button";
    title.addEventListener("click", () => openDoc(hit.id));
    li.appendChild(title);
    const info = el("div", undefined, "hit-info");
    info.appendChild(el("span", hit.id));
    info.appendChild(el("span", "релевантность " + hit.score.toFixed(3)));
    li.appendChild(info);
    li.appendChild(renderSnippet(hit.snippet));
    hits.appendChild(li);
  }
  const pages = Math.max(1, Math.ceil(data.total / state.size));
  const page = Math.floor(state.from / state.size) + 1;
  $("pager").hidden = data.total <= state.size && state.from === 0;
  $("page").textContent = "стр. " + page + " из " + pages;
  $("prev").disabled = state.from === 0;
  $("next").disabled = state.from + state.size >= Math.min(data.total, 1000);
}

function renderError(message) {
  $("hits").replaceChildren();
  $("pager").hidden = true;
  $("meta").textContent = "";
  $("empty").hidden = true;
  showWarning(message);
}

async function runSearch() {
  if (!state.q.trim()) {
    clearResults();
    return;
  }
  const p = new URLSearchParams({ q: state.q, operator: state.operator, from: state.from, size: state.size });
  if (state.fuzzy) p.set("fuzzy", "true");
  try {
    const resp = await fetch("/search?" + p.toString());
    if (!resp.ok) {
      renderError("Ошибка поиска: " + await errorText(resp));
      return;
    }
    renderResults(await resp.json());
  } catch (e) {
    renderError("Сервер недоступен: " + e.message);
  }
}

function search(push) {
  writeUrl(push);
  runSearch();
}

$("search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  hideSuggest();
  state.q = $("q").value;
  state.operator = $("operator").value;
  state.fuzzy = $("fuzzy").checked;
  state.from = 0;
  search(true);
});
$("operator").addEventListener("change", () => {
  state.operator = $("operator").value;
  state.from = 0;
  if (state.q) search(true);
});
$("fuzzy").addEventListener("change", () => {
  state.fuzzy = $("fuzzy").checked;
  state.from = 0;
  if (state.q) search(true);
});
$("prev").addEventListener("click", () => {
  state.from = Math.max(0, state.from - state.size);
  search(true);
});
$("next").addEventListener("click", () => {
  state.from += state.size;
  search(true);
});

const suggest = { timer: 0, seq: 0, items: [], active: -1 };
const LAST_WORD = /[\p{L}\p{N}_]+$/u;

function hideSuggest() {
  clearTimeout(suggest.timer);
  suggest.seq++;
  suggest.items = [];
  suggest.active = -1;
  $("suggest").hidden = true;
  $("suggest").replaceChildren();
  $("q").setAttribute("aria-expanded", "false");
}

function highlightSuggest() {
  [...$("suggest").children].forEach((li, i) => {
    li.classList.toggle("active", i === suggest.active);
    li.setAttribute("aria-selected", String(i === suggest.active));
  });
}

function applySuggest(word) {
  const input = $("q");
  input.value = input.value.replace(LAST_WORD, word) + " ";
  hideSuggest();
  input.focus();
}

function renderSuggest(items) {
  const list = $("suggest");
  suggest.items = items;
  suggest.active = -1;
  list.replaceChildren();
  for (const item of items) {
    const li = el("li");
    li.setAttribute("role", "option");
    li.appendChild(el("span", item.word));
    li.appendChild(el("span", String(item.count), "count"));
    li.addEventListener("mousedown", (e) => {
      e.preventDefault();
      applySuggest(item.word);
    });
    list.appendChild(li);
  }
  list.hidden = items.length === 0;
  $("q").setAttribute("aria-expanded", String(items.length > 0));
}

async function loadSuggest(prefix, seq) {
  try {
    const resp = await fetch("/suggest?" + new URLSearchParams({ prefix }).toString());
    if (!resp.ok) return;
    const data = await resp.json();
    if (seq === suggest.seq) renderSuggest(data.suggestions || []);
  } catch {
    if (seq === suggest.seq) hideSuggest();
  }
}

$("q").addEventListener("input", () => {
  const match = $("q").value.match(LAST_WORD);
  const prefix = match ? match[0] : "";
  hideSuggest();
  if ([...prefix].length < 2) return;
  const seq = suggest.seq;
  suggest.timer = setTimeout(() => loadSuggest(prefix, seq), 150);
});
$("q").addEventListener("keydown", (e) => {
  const n = suggest.items.length;
  if (e.key === "Escape") {
    hideSuggest();
    return;
  }
  if (!n) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const step = e.key === "ArrowDown" ? 1 : -1;
    suggest.active = (suggest.active + step + n + 1) % (n + 1);
    if (suggest.active === n) suggest.active = -1;
    highlightSuggest();
  } else if (e.key === "Enter" && suggest.active >= 0) {
    e.preventDefault();
    applySuggest(suggest.items[suggest.active].word);
  }
});
$("q").addEventListener("blur", hideSuggest);

const docs = { next: null, loading: false };

function docRow(doc) {
  const li = el("li");
  const main = el("div", undefined, "doc-main");
  const title = el("button", doc.title || doc.id, "link doc-title");
  title.type = "button";
  title.title = doc.title || doc.id;
  title.addEventListener("click", () => openDoc(doc.id));
  main.appendChild(title);
  main.appendChild(el("div", doc.id + " · " + doc.words + " " + plural(doc.words, "слово", "слова", "слов"), "doc-sub"));
  li.appendChild(main);
  const del = el("button", "✕", "icon");
  del.type = "button";
  del.title = "Удалить";
  del.setAttribute("aria-label", "Удалить " + (doc.title || doc.id));
  del.addEventListener("click", () => deleteDoc(doc.id, doc.title));
  li.appendChild(del);
  return li;
}

async function loadDocs(reset) {
  if (docs.loading) return;
  docs.loading = true;
  const p = new URLSearchParams({ size: "50" });
  if (!reset && docs.next) p.set("after", docs.next);
  try {
    const resp = await fetch("/docs?" + p.toString());
    if (!resp.ok) throw new Error(await errorText(resp));
    const data = await resp.json();
    if (reset) $("doc-list").replaceChildren();
    for (const doc of data.docs) $("doc-list").appendChild(docRow(doc));
    docs.next = data.next;
    $("more").hidden = !data.next;
    const count = data.total + " " + plural(data.total, "документ", "документа", "документов");
    $("docs-total").textContent = "· " + data.total;
    $("doc-count").textContent = count;
    $("docs-status").textContent = data.total === 0
      ? "Пока пусто. Загрузите первый файл."
      : (data.failed_shards || []).length ? "Часть документов временно недоступна." : "";
  } catch (e) {
    $("docs-status").textContent = "Не удалось загрузить список: " + e.message;
  } finally {
    docs.loading = false;
  }
}

$("more").addEventListener("click", () => loadDocs(false));

function refreshAll() {
  loadDocs(true);
  if (state.q) runSearch();
}

async function deleteDoc(id, title) {
  if (!confirm("Удалить «" + (title || id) + "»?")) return false;
  try {
    const resp = await fetch("/docs/" + encodeURIComponent(id), { method: "DELETE" });
    if (!resp.ok && resp.status !== 404) {
      $("docs-status").textContent = "Не удалось удалить " + id + ": " + await errorText(resp);
      return false;
    }
    $("docs-status").textContent = "Удалён: " + id;
    refreshAll();
    return true;
  } catch (e) {
    $("docs-status").textContent = "Ошибка: " + e.message;
    return false;
  }
}

const viewer = $("viewer");
let viewerDoc = null;

async function openDoc(id) {
  state.doc = id;
  writeUrl(false);
  viewerDoc = null;
  $("viewer-title").textContent = "Загрузка…";
  $("viewer-id").textContent = id;
  $("viewer-words").textContent = "";
  $("viewer-body").textContent = "";
  $("viewer-delete").disabled = true;
  if (!viewer.open) viewer.showModal();
  try {
    const resp = await fetch("/docs/" + encodeURIComponent(id));
    if (state.doc !== id) return;
    if (!resp.ok) {
      $("viewer-title").textContent = resp.status === 404 ? "Документ не найден" : "Ошибка";
      $("viewer-body").textContent = resp.status === 404 ? "Возможно, его уже удалили." : await errorText(resp);
      return;
    }
    const doc = await resp.json();
    viewerDoc = doc;
    $("viewer-title").textContent = doc.title || doc.id;
    const words = (doc.body.match(/[\p{L}\p{N}]+/gu) || []).length;
    $("viewer-words").textContent = words + " " + plural(words, "слово", "слова", "слов");
    $("viewer-body").textContent = doc.body;
    $("viewer-delete").disabled = false;
  } catch (e) {
    $("viewer-title").textContent = "Ошибка";
    $("viewer-body").textContent = "Сервер недоступен: " + e.message;
  }
}

$("viewer-close").addEventListener("click", () => viewer.close());
viewer.addEventListener("click", (e) => {
  if (e.target === viewer) viewer.close();
});
viewer.addEventListener("close", () => {
  state.doc = "";
  writeUrl(false);
});
$("viewer-delete").addEventListener("click", async () => {
  if (viewerDoc && await deleteDoc(viewerDoc.id, viewerDoc.title)) viewer.close();
});

function uploadLine(text, cls) {
  const li = el("li", text, cls);
  $("upload-results").prepend(li);
}

async function uploadFiles(fileList) {
  const files = [...fileList];
  const valid = [];
  for (const file of files) {
    const ext = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : "";
    if (!EXTENSIONS.includes(ext)) uploadLine("✕ " + file.name + ": нужен .txt или .docx", "error");
    else if (file.size > MAX_FILE) uploadLine("✕ " + file.name + ": больше 10 МБ", "error");
    else valid.push(file);
  }
  for (let i = 0; i < valid.length; i += MAX_BATCH) {
    const batch = valid.slice(i, i + MAX_BATCH);
    const form = new FormData();
    for (const file of batch) form.append("files", file, file.name);
    const pending = el("li", "Загрузка: " + batch.map((f) => f.name).join(", ") + "…", "exists");
    $("upload-results").prepend(pending);
    try {
      const resp = await fetch("/upload", { method: "POST", body: form });
      pending.remove();
      if (!resp.ok) {
        uploadLine("✕ " + await errorText(resp), "error");
        continue;
      }
      const data = await resp.json();
      for (const r of data.results) {
        if (r.status === "indexed") uploadLine("✓ " + r.file + " добавлен", "ok");
        else if (r.status === "exists") uploadLine("• " + r.file + ": документ «" + r.id + "» уже есть", "exists");
        else uploadLine("✕ " + r.file + ": " + r.error, "error");
      }
    } catch (e) {
      pending.remove();
      uploadLine("✕ Сервер недоступен: " + e.message, "error");
    }
  }
  refreshAll();
}

const drop = $("dropzone");
$("files").addEventListener("change", () => {
  uploadFiles($("files").files);
  $("files").value = "";
});
["dragenter", "dragover"].forEach((type) => drop.addEventListener(type, (e) => {
  e.preventDefault();
  drop.classList.add("over");
}));
["dragleave", "drop"].forEach((type) => drop.addEventListener(type, (e) => {
  e.preventDefault();
  drop.classList.remove("over");
}));
drop.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

window.addEventListener("popstate", () => {
  readUrl();
  runSearch();
  if (state.doc) openDoc(state.doc); else if (viewer.open) viewer.close();
});

readUrl();
runSearch();
loadDocs(true);
if (state.doc) openDoc(state.doc);
</script>
</body>
</html>
